name: Sync Mr. Lexx Gallery

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-mr-lexx-gallery.mjs'
      - '.github/workflows/sync-mr-lexx-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Mirror rendered Mr. Lexx gallery originals
        run: node scripts/sync-mr-lexx-gallery.mjs

      - name: Commit gallery media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/mr-lexx
          if git diff --cached --quiet; then
            echo "No gallery changes to commit."
            exit 0
          fi
          git commit -m "Mirror original Mr. Lexx media gallery"
          git push origin HEAD:main
